name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.allahtala --project-name allah_tala_share .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="ALLAH TALA Share"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Create launcher icons
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLAH-TALA-Share-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ALLAH TALA Share build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
